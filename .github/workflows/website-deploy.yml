# REQ-238：项目官网（website/）构建并发布到 GitHub Pages
# 内容单源：模块介绍构建期内联 platform-knowledge/ 模块导读页、演示数据内联
# ontology-service/internal/seed/ 种子 spec——这些目录变更时站点随重建更新。
# 首次启用需在仓库 Settings → Pages 将 Source 设为「GitHub Actions」。
name: website-deploy

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'platform-knowledge/**'
      - 'ontology-service/internal/seed/**'
      - 'web/src/api/types.ts'
      - '.github/workflows/website-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            website/package-lock.json
            web/package-lock.json
      # website 构建跨目录复用 web/src 可视化组件（Graph3D/SpecGraph），组件的 bare import
      # （antd/three/@xyflow/react 等）自 web/ 目录向上解析依赖——必须先装 web/node_modules
      # （本地可构建正是同因；缺失即 Rollup failed to resolve import "antd"）
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Build website
        working-directory: website
        run: |
          npm ci
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
